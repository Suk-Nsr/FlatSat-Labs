name: Lab Code Release Automator

on:
  # Trigger automatically when code is pushed to the 'main' branch
  push:
    branches:
      - main
  
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Specify the tag name for this manual release (e.g., v1.0.1)'
        required: true
        default: 'manual-release'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    # Required permissions to create and delete releases/tags on GitHub
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare and compress Lab Code directories
        run: |
          # Create an output directory for the final ZIP files
          mkdir -p output_zips
          
          # Iterate through all directories matching the pattern 'Lab_*'
          for lab_dir in Lab_*; do
            # Check if the 'Code' directory exists inside the Lab folder
            if [ -d "$lab_dir/Code" ]; then
              # Extract the lab number
              LAB_NUM=$(echo "$lab_dir" | grep -o -E '[0-9]+')
              ZIP_FILENAME="Lab${LAB_NUM}_Code.zip"
              
              echo "Zipping contents of $lab_dir/Code into $ZIP_FILENAME..."
              
              # Change directory to zip contents directly
              cd "$lab_dir/Code"
              
              # Compress all files and folders, excluding git tracking files
              zip -r "../../output_zips/$ZIP_FILENAME" ./* -x "*.git*"
              
              # Return to the root directory
              cd -
            fi
          done
          
          # List generated files for debugging purposes
          ls -lh output_zips/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          # Use manual tag if triggered manually, otherwise auto-generate tag based on run number
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || format('main-build-{0}', github.run_number) }}
          # Path to the generated ZIP files
          files: output_zips/*.zip
          generate_release_notes: true

      - name: Delete older releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          # Keep only the latest 1 release (the one that was just created above)
          keep_latest: 1
          # Automatically delete the old tags associated with the deleted releases
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}