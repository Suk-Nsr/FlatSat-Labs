name: Lab Code Release Automator

on:
  # Trigger automatically when code is pushed to the 'main' branch
  push:
    branches:
      - main
  
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Specify the tag name for this manual release (e.g., v1.0.1)'
        required: true
        default: 'manual-release'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    # Only run if the commit message contains [release] or if manually triggered
    if: contains(github.event.head_commit.message, '[release]') || github.event_name == 'workflow_dispatch'
    
    # Required permissions to create and delete releases/tags on GitHub
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare and compress separate Code and Solution directories
        run: |
          # Create an output directory for the final ZIP files
          mkdir -p output_zips
          
          # Process Final_Labs if it exists
          if [ -d "Final_Labs" ]; then
            echo "Zipping Final_Labs Code for students..."
            # Zip only the 'Code' folders inside all Lab directories in Final_Labs
            zip -r "output_zips/Final_Labs_Code.zip" Final_Labs/*/Code -x "*.git*" || echo "Warning: No Code folders found in Final_Labs"
            
            echo "Zipping Final_Labs Solution for teachers..."
            # Zip only the 'Solution' folders inside all Lab directories in Final_Labs
            zip -r "output_zips/Final_Labs_Solution.zip" Final_Labs/*/Solution -x "*.git*" || echo "Warning: No Solution folders found in Final_Labs"
          else
            echo "Final_Labs directory not found!"
          fi
          
          # Process Full_Labs if it exists
          if [ -d "Full_Labs" ]; then
            echo "Zipping Full_Labs Code for students..."
            # Zip only the 'Code' folders inside all Lab directories in Full_Labs
            zip -r "output_zips/Full_Labs_Code.zip" Full_Labs/*/Code -x "*.git*" || echo "Warning: No Code folders found in Full_Labs"
            
            echo "Zipping Full_Labs Solution for teachers..."
            # Zip only the 'Solution' folders inside all Lab directories in Full_Labs
            zip -r "output_zips/Full_Labs_Solution.zip" Full_Labs/*/Solution -x "*.git*" || echo "Warning: No Solution folders found in Full_Labs"
          else
            echo "Full_Labs directory not found!"
          fi
          
          # List generated files for debugging purposes
          ls -lh output_zips/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          # Use manual tag if triggered manually, otherwise auto-generate tag based on run number
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || format('main-build-{0}', github.run_number) }}
          # Path to all 4 generated ZIP files
          files: output_zips/*.zip
          generate_release_notes: true

      - name: Delete older releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          # Keep only the latest 1 release (the one that was just created above)
          keep_latest: 1
          # Automatically delete the old tags associated with the deleted releases
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}